<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3a0d1d" />
    <meta name="robots" content="noindex" />
    <title>Sparkle Makeover · Studio desk</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Mukta:wght@400;500;600;700&family=Playfair+Display:wght@500;600&family=Noto+Serif+Devanagari:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <section class="gate" id="gate">
      <form id="login-form" class="gate-card">
        <img src="assets/logo.svg" alt="Sparkle Makeover logo" width="64" height="64" />
        <p class="mark">Sparkle Makeover · Orai</p>
        <h1 id="login-title">स्टूडियो डेस्क</h1>
        <p id="login-hint">यह पृष्ठ ग्राहकों के लिए नहीं है।</p>
        <label id="email-label">ईमेल
          <input id="email" name="email" type="email" autocomplete="username" value="rajavikramaditya0@gmail.com" required />
        </label>
        <label id="password-label">कूटशब्द
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="warn" id="login-error" role="alert"></p>
        <button class="gold" type="submit" id="login-submit">प्रवेश</button>
      </form>
    </section>

    <div id="desk" hidden>
      <header class="top">
        <div class="brandline">
          <img src="assets/logo.svg" alt="Sparkle Makeover logo" width="42" height="42" />
          <div>
            <strong>Sparkle</strong>
            <small>Orai</small>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" id="lang-btn" class="quiet">EN</button>
          <button type="button" id="logout-btn" class="quiet"></button>
        </div>
      </header>
      <nav class="tabs" id="tabs"></nav>
      <main id="view"></main>
      <p class="desk-foot">Designed by <b>OrbitCore</b></p>
    </div>
    <p class="toast" id="toast" hidden></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
